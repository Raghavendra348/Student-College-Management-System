  <text x="65" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" letter-spacing="0.5">COLLEGE MANAGEMENT SYSTEM</text>
